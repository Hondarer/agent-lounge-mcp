name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet for other OSes
        if: runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race check
        if: runner.os == 'Linux'
        run: go test -race ./...
      # The interactive verification harness (scripts/interactive) drives agent CLIs, which CI
      # does not have; its self-tests use a stand-in CLI and need only Python.
      - name: Harness self-tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/interactive/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe determines the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile all targets
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: agent-lounge-mcp-${{ github.sha }}
          path: dist/
          retention-days: 14
